# Cortex config. Live copy: ~/.config/marrow/cortex.toml (override path via CORTEX_CONFIG env)
# Missing file / missing keys -> defaults below apply (tolerant load).

[core]
# Empty/absent = follow the OS timezone. Set an IANA name only for
# headless/VPS deploys where the OS tz differs from the user's.
timezone = ""
# Shell ids running as cortex shells (mirror of marrow [cortex].shells).
# "cli" absent = this repo's heartbeat (wake daemon + watchdog) stays down.
shells = ["cli"]

[paths]
# Empty = use the default paths listed in comments.
# Default: ~/.config/marrow/marrow.db
marrow_db = ""
# Default: ~/Library/Application Support/Knowledge/knowledgeC.db
knowledgec_db = ""
# iOS Shortcuts geofence log, appended by an "arrived/left" automation.
# Lines look like "HH:MM event text"; no default, must be set to enable.
geofence_file = ""
# Health export JSON (iOS Shortcut nightly dump). No default, must be set to enable.
health_export = ""
# Affect-flag file (JSON dict written by A1/upset lane). Default: ~/.config/marrow/cortex/state/affect_flag.json
affect_flag_file = ""
# Self-schedule queue (JSON list of {due_at}). Default: ~/.config/marrow/cortex/state/self_schedule.json
self_schedule_file = ""
# Handoff note every shell reads/writes (assistant's handoff; one rolling log,
# mirror of marrow [cortex].handoff_file).
# Default: ~/.config/marrow/cortex/handoff.md
handoff_file = ""
# Cortex session cwd (own CLAUDE.md lives here). Default: ~/.config/marrow/cortex
cortex_home = ""
# Non-cli shell ledgers (<dir>/<shell>.json) — mirror of marrow's
# [cortex].shell_state_dir. Default: ~/.config/marrow/state/shells
shell_state_dir = ""
# Wishlist md, pure append-only, symlinked into NY. Default: <cortex_home>/wishlist.md
wishlist_file = ""
# NY db-pages dir wishlist.md gets symlinked into (daybrief.md is a real
# marrow-owned file here, not a cortex symlink).
ny_db_pages = ""
# Wake-latency probe log (cortex stage marks + marrow stream-event marks).
# Default: ~/.config/marrow/logs/wake_timing.log
wake_timing_log = ""
# Wake-state audit trail (alarm epoch/generation events). Byte-shared with
# marrow's [cortex].wake_audit_log_file. Default: <cortex_home>/state/wake_audit.log
wake_audit_log = ""
# Interactive-window (B3v) runtime files. Empty = defaults under cortex_home/state/.
wake_state_file = ""     # awake marker + resident iTerm session id. Default: <home>/state/wake_state.json
wakeup_note_file = ""    # note text the window is told to Read. Default: <home>/wakeup_note.md
# Invisible free-round payload staged for the marrow hook (the window only sees
# the short ⏳ marker). Match marrow [cortex].free_round_note_file.
free_round_note_file = ""  # Default: <home>/free_round_note.md
watchdog_pidfile = ""    # per-wake watchdog pid. Default: <home>/state/watchdog.pid
spawn_lock_file = ""     # serializes every window-spawn entrant. Default: <home>/state/spawn.lock
# Claude Code transcript dir for the window. Empty = derived from cortex_home
# (munge non-alphanumeric -> '-'). Default: ~/.claude/projects/<munged cortex_home>
transcript_dir = ""

# marrow repo invocation for subprocess helpers (separate venv/deps from cortex).
[marrow]
venv_python = "~/CC-Lab/marrow/.venv/bin/python"

[wake]
# Auto-adopt a cortex window you opened `claude` in yourself (in cortex_home) but
# never registered: the reconcile pass records it as the resident (under the spawn
# lock) instead of firing/spawning a duplicate window. Interactive-tty only, so a
# headless `claude -p` run against the same cwd is never adopted. false = off.
auto_adopt = true
# Wake delivery is the resident interactive iTerm cli (B3v) and nothing else: a
# window failure alerts and gives up the round. The window body = one `claude`
# in cortex_home with MARROW_CORTEX=1 MARROW_CHANNEL=ct set explicitly.
session_name = "cortex"        # iTerm session name for the resident window
launch_command = "claude"      # command run in the window (env markers prepended)
window_model = ""              # --model for cortex windows; "" = omit flag and
                               # inherit the environment default
window_effort = ""             # --effort (low|medium|high|xhigh|max); "" = omit flag
skip_permissions = true        # add --dangerously-skip-permissions so a fresh dir's
                               # trust dialog never blocks the injected note
ready_marker = "accept edits"  # TUI footer text signalling claude is ready for input
ready_timeout_sec = 30         # max wait for readiness after a fresh spawn
# An already-running resident window is woken by TYPING the bell line into it.
# ear_timeout_sec = how long that wake is given to land (transcript grows) before
# the resident is replaced by a FRESH window that gets the note as its first
# prompt.
ear_timeout_sec = 90           # recovery deadline for an alive-window wake to land before respawn
# A fresh window (rotate / dead resident / bell miss) is spawned with this as
# claude's FIRST prompt — JUST an emoji, so nothing readable shows in the user's
# face; the window wakes silently. The full wake instructions (read the note,
# choose next wake) are injected by marrow's UserPromptSubmit hook
# when this exact emoji is submitted in a cortex window.
wake_prompt = "☀️"
# Visible wake lines = HUMAN TEXT ONLY (no machine marker, no epoch token). The
# machine data (template/gen/state_id/rearm) is written to the wake_state receipt
# sidecar at send time; the marrow hook exact-matches the on-screen line against
# it. {hm} = local HH:MM; a fully STATIC template with no {hm} is also valid.
# Must match marrow [cortex].spawn_opener_template / [cortex].wake_bell_template.
#   spawn_opener_template = first prompt baked into a FRESHLY SPAWNED window
#     (also the window-lineage marker used to find resumable sessions).
#   wake_bell_template = line TYPED into an already-running resident window.
spawn_opener_template = "[☀️ {hm}]"
wake_bell_template = "⏰ {hm}"
# Pending-receipt time-to-live (minutes): the consumer ignores an older receipt
# and the producer overwrites it on each new bell. Match marrow receipt_ttl_min.
receipt_ttl_min = 15
# say() = the ONLY place cortex takes focus: it fronts the resident window and
# plays a system sound (name of a /System/Library/Sounds/*.aiff; "" = silent).
say_sound = "Glass"
# lie_down(next_wake_min=N) legal minutes: two bands at every hour — [0, next_wake_low_max]
# and [next_wake_high_min, next_wake_max] (0 = immediate re-wake). The gap between the bands
# is unselectable: a choice landing there snaps silently to the nearer band edge.
next_wake_max = 360
next_wake_low_max = 55
next_wake_high_min = 180
# Minutes until the next wake when no caller picked one (proxy lie_down, daemon/
# ctl/reconcile re-arm after a failed round). Cross-repo interval contract: keep
# equal to [wake.watchdog].silent_max_min and synapse tg [cortex].shell_idle_min.
default_sleep_min = 20
lock_alert_throttle_min = 60 # max one wake_state lock give-up alert per this many minutes
# Free-round line typed into the window at every silence-cycle injection
# (last line of the block, after the freshly rendered note). MUST contain the
# "[NEW ROUND]" machine-line marker — without it the line resets the silence
# timer it just armed (perpetual loop). {mins}/{user} optional.
tuck_in_text = "⏳ [NEW ROUND]"
# Markers identifying a NON-user turn (so they don't reset the silence timer and
# downstream memory drops them). Both wake-line prefixes (spawn_opener_template,
# wake_bell_template) are added automatically. Substring match: "[CMD" catches
# every ⚙️ [CMD ct-*] slash-command body.
machine_line_markers = ["[NEW ROUND]", "[FUSE]", "[CTL]", "[CMD"]
free_round_note = true       # every free-round injection appends a freshly rendered wakeup note above the marker line (diff mode: only events since the last rendered note this wake)
# Covert-delivery markers typed into the window. Only the marker reaches the screen; the body is
# injected invisibly by the marrow hook (fuse -> [cortex].fuse_prompt_text; ctl ->
# [cortex].ctl_sleep_text from the mins/rotate args).
fuse_marker = "⚙️ [FUSE]"
ctl_sleep_marker = "⚙️ [CTL]"

# Per-wake watchdog thresholds (spawned at injection, killed at lie_down).
[wake.watchdog]
poll_sec = 60
silent_max_min = 20            # silence cycle (same bar for chat or no-user wake): at this silence, inject one free-round note + marker, then re-arm the same timer
fuse_tokens = 300000           # window tokens >= this -> esc + proxy lie_down (fuse); marrow's soft nudge (cortex_rotate.show_tokens) fires first
# Process-level hard interrupt (SIGINT), a guaranteed esc-equivalent for when the
# osascript esc may not land (no window focus). Fires after esc on the fuse
# path, only if the transcript is still growing past the grace window.
hard_interrupt_enabled = true
hard_interrupt_grace_sec = 30
# On the fuse path, after esc the session is prompted to write its handoff and
# lie_down(rotate=True). It gets this many seconds to do so itself before the
# force path (SIGINT + proxy lie_down) fires. Hard deadline — the fuse never hangs.
fuse_handoff_grace_sec = 300
# FUSE prompt body now lives marrow-side ([cortex].fuse_prompt_text) — cortex writes only the
# ⚙️ [FUSE] marker; the marrow hook injects the body covertly. The old cortex-side
# fuse_handoff_prompt override is retired.

# Stale-wake guard: tick sees the awake marker but the transcript has been idle
# this long -> presume the watchdog died, proxy lie_down (force_slept=stale).
[wake.stale]
threshold_min = 15
# A single dead-window verdict can be a transient osascript hiccup (the window
# was actually alive). Require this many CONSECUTIVE dead verdicts (same
# snapshot gen, within the suspect TTL) before reaping. 1 = old immediate reap.
confirm_ticks = 2

[knowledgec]
# knowledgeC.db ZSTREAMNAME to read app-usage rows from.
stream_name = "/app/usage"

[knowledgec.categories]
# bundle_id = category. Anything not listed here falls under "default" below.
default = "uncategorized"

[geofence]
enabled = false

[health]
enabled = false

# launchd tick cadence (seconds). Baked into the plists at `python -m cortex.install`.
[tick]
collect_interval_sec = 1800    # collectors ~30min
usage_snapshot = true          # OAuth usage % snapshot (marrow subprocess) each tick

# Wake brake: gates whether a fired ledger wake actually spawns a window or is
# log-only (still re-arming the next wake). Covers both fire paths — the daemon
# business deadline and the reconcile dead-window fire.
[pacemaker]
dry_run = true                 # log-only; flip to false only once outbound (C5) lands

# External-wake (cortex.kick) reason lines rendered as plain lines in the wakeup
# note (no section header), then cleared on delivery. A bridge/cli poke appends
# one; note.py renders + consumes it. {id} = outbox note id; {text} = her reply
# body (bridge-truncated); {minutes} = channel silence minutes.
[kick]
reason_reply = 'Msg #{id} replied: "{text}"'
reason_timeout = "Msg #{id} no reply in {minutes}min"
reason_morning = "She's up — day mode"
reason_note = "New note #{id}"  # F9: ct note dropped -> immediate carrier round
max_reasons = 8                # cap the pending-flag list (stuck bridge guard)

# Wakeup note knobs. Every line is deterministic now, so the old whole-note
# max_chars cap is gone; per-source limits below keep each line bounded.
# Persona/display strings + behaviour (identity stays in config).
[note]
# Machine-origin tag prepended as the FIRST line of every wakeup note (before
# title). Makes the model treat the ☀️ bell/wake-prompt turn that delivered this
# note as an automated scheduler signal, not a message the user typed. Note copy
# only — does not change the bell text or receipt matching. "" omits it.
wake_machine_tag = "[AUTOMATED WAKE SIGNAL — Note delivered by the scheduler]"
title = ""                   # first line of the wakeup note, e.g. a nickname for the note; empty hides it
pending_window_min = 15      # surface a self-schedule entry only when due within this window
pause_tag = "(paused: {reason})"  # appended to the "🐆 Cortex last wake: …" line while the circuit breaker covers THIS shell. {reason} = manual/auto_fuse, {scope} = all/cli/tg; "" omits the tag
handoff_title = "碎碎念"   # title of the handoff-note section (customisable display name)
handoff_wake_kinds = ["rotate"]  # wake kinds that get the handoff (fresh window only)
cadence_bin = ""             # cadence CLI for cal/rem lines; empty = packaged default path
turn_end_text = ""           # one-line reminder appended at the end of every rendered note; "" omits it (the silence cycle already carries this). {next_wake_min}/{next_wake_low_max}/{next_wake_high_min}/{next_wake_max}/{silent_max_min} render from the wake clamps
receipt_line = 'Note #{id} ({channel} {sent_hm}): she replied {replied_hm} "{text}"'  # reply-receipt line (C11); one per note she replied to since last note. {id}/{channel}/{sent_hm}/{replied_hm}/{text} from the outbox row; "" omits receipts
# Header written into a freshly-created wishlist.md (append-only; never overwritten). Display text — customise freely.
wishlist_header = "# Wishlist\n\n(owed treats / wants / self-rewards — append-only)\n"

# Cross-channel note delivery into the cortex window.
[outbox]
inject_header = "📮 Message from {channel}·{sid4} {time}"  # header for a ct-targeted outbox note rendered by the wakeup note; mirror of marrow [outbox].inject_header (keep in sync). {channel}/{sid4}/{time} from the outbox row; "" = body only

# cortex.daemon — the always-on cli timing loop (scheduler-hosted; replaces the
# launchd pacemaker cron). Two deadlines: "<shell>.reconcile" on a fixed cadence
# and "<shell>" for business (next_wake_at ledger / silence free-round). lie_down
# kicks "<shell>" over the socket so a new alarm is picked up instantly.
[daemon]
enabled = true
shell = "cli"                  # scheduler shell key; reconcile key = "<shell>.reconcile"
socket_path = ""               # kick socket; "" -> <cortex_home>/state/cortex-daemon.sock (must stay under 104 bytes — AF_UNIX limit)
kick_timeout_sec = 1.0         # lie_down -> daemon kick connect/send timeout
reconcile_interval_sec = 60    # reconcile cadence (also the scheduler's max sleep)
safety_horizon_sec = 300       # business re-arm gap when nothing is pending
retry_interval_sec = 60        # business re-arm gap after a held/failed fire (anti-spin)
lock_path = ""                 # singleton lock; "" -> <cortex_home>/state/daemon.lock

# Duty rotation — at most one cortex shell on duty, the other held. State lives
# in duty.json beside breaker.json (mode = intent, hold = pause scope);
# enforcement takes the union of breaker.json and that hold.
[duty]
fresh_token_threshold = 80000  # incoming shell spawns fresh (not resumed) above this window occupancy
fresh_age_hours = 8            # …or when its last activity is older than this
# Source line leading the wakeup note of a shell woken BY a duty rotation.
# {from_shell} = shell the transfer came from, {shell} = shell now on duty,
# {hold} = the hold it materialised. "" omits the line; auto wakes carry none.
transfer_source_text = "🔄 transferred from {from_shell} | {shell} on, {hold} hold"
ctl_source_text = "Kicked by /ct-duty - {shell} on, {hold} hold"
hold_none_label = "no"         # rendered for {hold} when the mode holds nothing
